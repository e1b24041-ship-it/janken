<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <title>Janken Wait</title>
</head>

<body>
  <a href="/logout">ログアウト</a>
  <h1>Janken GAME!</h1>
  <p th:text="'Hi ' + ${loginUser}"></p>
  <p>相手の手を待ってます</p>

  <!-- 非同期で書き換わる部分 -->
  <div id="result"></div>

  <!-- EventSourceを利用した非同期処理 -->
  <script>
    window.onload = function () {
      var sse = new EventSource('/wait/result');
      sse.addEventListener("matchResult", function (event) {
        var resultDiv = document.getElementById("result");
        // 受け取ったデータと[戻る]リンクを表示する
        resultDiv.innerHTML = "<p>結果</p><p>" + event.data + "</p><a href='/janken'>もどる</a>";
      });
    }
  </script>
</body>

</html>

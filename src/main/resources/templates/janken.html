<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <title>Janken GAME!</title>
</head>

<body>
  <a href="/logout">ログアウト</a>

  <h1>Janken GAME!</h1>

  <p>エントリー</p>
  <ul>
    <li th:each="user : ${entry.users}" th:text="${user}"></li>
  </ul>

  <!-- 余力課題：エントリー人数の表示 -->
  <p th:text="'今' + ${#lists.size(entry.users)} + '人がエントリーしています'"></p>

  <p th:text="'Hi ' + ${loginUser}"></p>
  <a href="/janken?hand=Gu">ぐー</a>
  <a href="/janken?hand=Choki">ちょき</a>
  <a href="/janken?hand=Pa">ぱー</a>
</body>

</html>

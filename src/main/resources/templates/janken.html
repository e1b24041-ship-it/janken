<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <title>Janken GAME!</title>
</head>

<body>
  <a href="/logout">ログアウト</a>

  <h1>Janken GAME!</h1>

  <p>エントリー</p>
  <ul>
    <li th:each="user : ${users}" th:text="${user.name}"></li>
  </ul>

  <p>試合結果</p>
  <ul>
    <li th:each="match : ${matches}"
      th:text="'id:' + ${match.id} + ' user1:' + ${match.user1} + ' user2:' + ${match.user2} + ' user1の手:' + ${match.user1Hand} + ' user2の手:' + ${match.user2Hand}">
    </li>
  </ul>

  <!-- 余力課題：エントリー人数の表示 -->
  <p th:text="'今' + ${#lists.size(users)} + '人がエントリーしています'"></p>

  <p th:text="'Hi ' + ${loginUser}"></p>
  <a href="/janken?hand=Gu">ぐー</a>
  <a href="/janken?hand=Choki">ちょき</a>
  <a href="/janken?hand=Pa">ぱー</a>
</body>

</html>
